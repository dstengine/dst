<!-- xmr0.uk's mark: the letters x and 0 in white, bold, on the teal of the light theme. A plain
     typographic mark, drawn here rather than generated; centred, with the
     margin inside the crop, so a circle keeps the whole of it. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#0F5C63"/>
  <text x="512" y="512" dy="0.35em" text-anchor="middle" fill="#FFFFFF"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="400" font-weight="700" letter-spacing="-12">x0</text>
</svg>
