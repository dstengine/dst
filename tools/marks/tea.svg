    <path d="M292 424 H732 C732 594 646 694 512 694 C378 694 292 594 292 424 Z" fill="#D9B25F"/>
    <rect x="232" y="720" width="560" height="44" rx="22" fill="#D9B25F"/>
    <path data-detail="" d="M448 372 C412 334 484 302 448 252" fill="none" stroke="#D9B25F" stroke-width="28" stroke-linecap="round"/>
    <path data-detail="" d="M576 372 C540 334 612 302 576 252" fill="none" stroke="#D9B25F" stroke-width="28" stroke-linecap="round"/>
  </g>
</svg>
