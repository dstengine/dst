<!-- tea.ceo's mark: a cup and saucer in brass on oxblood, the site's two
     accents — the fittings and the leather of the rooms on its covers. The
     two curls of steam are detail (data-detail) and drop out below 48px,
     where the cup alone reads better. Centred on the cup and handle
     together, with room to spare, so a crop to a circle keeps the handle. -->
