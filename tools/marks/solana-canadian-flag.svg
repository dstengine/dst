<!-- The Solana mark in the colours of the Canadian flag, for the Superteam
     Canada community calls. Same idea as the Armenian one beside it: three
     bars, three bands, colours in the order they fly — red, white, red.
     Red is the Government of Canada's own #D80621; the geometry is
     Solana's.

     A national chapter gets its flag; an event that merely happens in a
     country does not. Applied by tools/marks/apply.mjs. -->
