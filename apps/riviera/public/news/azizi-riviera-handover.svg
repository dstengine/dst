<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Azizi Riviera handover progress: 53 of 75 buildings delivered — all of phases 1 to 3 plus five buildings of phase 4 — with 22 buildings still to come as of August 2025.">
  <style>
    /* Self-contained palette: a page can't style an SVG loaded via &lt;img&gt;.
       Mirrors the network tokens and this site's canal blue. */
    .bg { fill: #FAF9F6; }
    .ink { fill: #14181F; }
    .faint { fill: #6D727A; }
    .rule { stroke: #E2DFD7; }
    .done { fill: #1D6FA5; }
    .done-p4 { fill: #7FB2D4; }
    .todo { fill: none; stroke: #C4C7C1; stroke-width: 2; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #191C20; }
      .ink { fill: #DCDFE3; }
      .faint { fill: #7A7F86; }
      .rule { stroke: #2B2F35; }
      .done { fill: #6FB3DE; }
      .done-p4 { fill: #3C6F92; }
      .todo { fill: none; stroke: #3A3F46; stroke-width: 2; }
    }
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .caps { font-size: 17px; letter-spacing: 0.14em; }
    .huge { font-size: 96px; font-weight: 600; letter-spacing: -0.02em; }
    .label { font-size: 21px; }
    .tiny { font-size: 15.5px; }
  </style>

  <rect class="bg" width="1200" height="640" />

  <!-- One square per building, so the remaining work is countable rather
       than described. -->
  <text class="huge ink" x="80" y="128">53<tspan class="faint" font-size="52">/75</tspan></text>
  <text class="caps faint" x="80" y="164">BUILDINGS HANDED OVER &#183; AUG 2025</text>

  <text class="label ink" x="1120" y="96" text-anchor="end">~16,000 residences</text>
  <text class="tiny faint" x="1120" y="126" text-anchor="end">mid- and high-rise, along the canal</text>
  <text class="tiny faint" x="1120" y="156" text-anchor="end">remaining 22 targeted through Q2 2026</text>

